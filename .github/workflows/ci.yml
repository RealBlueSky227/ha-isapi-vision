name: Integration checks
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - name: Official HACS validation, with every check enabled
        uses: hacs/action@main
        with:
          category: integration
          comment: false
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: bash -n tools/deploy_docker.sh
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py
      - run: python tools/package.py
  home-assistant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libturbojpeg libavdevice-dev ffmpeg
      - run: python -m pip install -r requirements-test-ha.txt
      - name: Real HA tests and complete config-flow coverage
        run: python -m pytest tests_ha -q --cov=custom_components.isapi_vision.config_flow --cov-report=term-missing --cov-report=xml --cov-fail-under=100
