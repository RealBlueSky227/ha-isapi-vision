name: Bug report
description: Report a reproducible ISAPI Vision problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private addresses, hostnames, serial numbers, raw XML or camera images. Inspect diagnostics before attaching them. Use SECURITY.md for private vulnerability reporting.
  - type: input
    id: integration_version
    attributes:
      label: ISAPI Vision version
      placeholder: 0.1.0b1
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version and installation type
      placeholder: HA 2026.10.2, Container
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Camera model and firmware
      description: Manufacturer, model reported by ISAPI, and firmware version only.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior, actual behavior and reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostic_summary
    attributes:
      label: Sanitized diagnostic summary
      description: Relevant error categories, feature support/enabled/evidence, or sanitized logs. State whether HTTP or HTTPS is used and whether certificate validation is enabled. No secrets or raw configuration exports.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I reviewed the report and attachments for credentials and identifying camera/network information.
          required: true
